<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Draw Pad</title>
<style>
  :root { --bg:#12161d; --panel:#1c2330; --ink:#eef1f5; --dim:#8b97a7; --go:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0 auto; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,sans-serif; padding:12px; max-width:420px; }
  h1 { font-size:20px; margin:0 0 8px; }
  #cv { display:block; width:100%; max-width:300px; aspect-ratio:3/4; margin:0 auto 10px; background:#000; border:2px solid #323d50; border-radius:6px; touch-action:none; cursor:crosshair; }
  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
  button, select { flex:1; min-width:30%; padding:12px; border:0; border-radius:8px; background:var(--panel); color:var(--ink); font-size:15px; }
  button.main { background:var(--go); color:#06150b; font-weight:600; }
  button.on { outline:3px solid var(--ink); }
  .sw { flex:none; min-width:0; width:38px; height:38px; border-radius:50%; border:2px solid #3b4658; padding:0; }
  .sw.on { outline:3px solid var(--ink); outline-offset:2px; }
  button:focus-visible, select:focus-visible { outline:2px solid #ffd23f; }
  #st { color:var(--dim); font-size:13px; min-height:20px; }
</style>
</head>
<body>
<h1>ESP32 Draw Pad</h1>
<canvas id="cv" width="240" height="320"></canvas>
<div class="row" id="pal"></div>
<div class="row" id="sizes">
  <button data-s="2">Thin</button>
  <button data-s="5" class="on">Medium</button>
  <button data-s="9">Thick</button>
</div>
<div class="row">
  <button class="main" id="bBle">Connect ESP32</button>
  <button id="bClear">Clear</button>
</div>
<div class="row">
  <select id="chunk" aria-label="Bluetooth chunk size">
    <option value="100">Chunk 100 bytes (fast)</option>
    <option value="20">Chunk 20 bytes (slow, safest)</option>
    <option value="180">Chunk 180 bytes (fastest)</option>
  </select>
</div>
<div id="st">Draw on the black box. Connect the ESP32 to see it on the TFT.</div>

<script>
const SERVICE = '7a1c0001-0000-4000-8000-00000000a001';
const CHAR    = '7a1c0002-0000-4000-8000-00000000a001';
// color 0 is black = the eraser
const COLORS = ['#000000', '#ffffff', '#ff0000', '#ff9500', '#ffee00', '#00ff00', '#2a8cff', '#b040ff'];
let color = 1, size = 5, chr = null, history = [], queue = [], sending = false;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const status = m => $('st').textContent = m;
ctx.lineCap = 'round'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 240, 320);

// palette buttons
COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i === color ? ' on' : ''); b.style.background = c;
  b.setAttribute('aria-label', i === 0 ? 'Eraser' : 'Color ' + i);
  b.onclick = () => { color = i; document.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
  $('pal').appendChild(b);
});
$('sizes').querySelectorAll('button').forEach(b => b.onclick = () => {
  size = +b.dataset.s; $('sizes').querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
});

// message: 0x02, color, size, x0, y0, x1, y1 (positions are 16-bit little endian)
function segBytes(s) {
  const b = new Uint8Array(11), dv = new DataView(b.buffer);
  b[0] = 2; b[1] = s.c; b[2] = s.s;
  dv.setUint16(3, s.x0, true); dv.setUint16(5, s.y0, true); dv.setUint16(7, s.x1, true); dv.setUint16(9, s.y1, true);
  return b;
}
function enqueue(bytes) { queue.push(...bytes); pump(); }

async function pump() {
  if (sending || !chr) return;
  sending = true;
  const n = +$('chunk').value;
  try {
    while (queue.length && chr) { const part = queue.splice(0, n); await chr.writeValueWithoutResponse(new Uint8Array(part)); }
  } catch (e) { status('Send failed: ' + e.message); chr = null; $('bBle').textContent = 'Connect ESP32'; }
  sending = false;
}

// drawing
function pos(e) {
  const r = cv.getBoundingClientRect();
  return [Math.max(0, Math.min(239, Math.round((e.clientX - r.left) * 240 / r.width))),
          Math.max(0, Math.min(319, Math.round((e.clientY - r.top) * 320 / r.height)))];
}
function segment(x0, y0, x1, y1) {
  ctx.strokeStyle = COLORS[color]; ctx.lineWidth = size;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const s = { c: color, s: size, x0, y0, x1, y1 };
  if (history.length < 30000) history.push(s);
  enqueue(segBytes(s));
}
let last = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); last = pos(e); segment(last[0], last[1], last[0], last[1]); });
cv.addEventListener('pointermove', e => { if (!last) return; const p = pos(e); if (p[0] === last[0] && p[1] === last[1]) return; segment(last[0], last[1], p[0], p[1]); last = p; });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => last = null));

$('bClear').onclick = () => {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 240, 320); history = []; queue = [];
  enqueue([1]);
};
$('bBle').onclick = async () => {
  if (!navigator.bluetooth) return status('Web Bluetooth is not available. Use Chrome on Android, over https.');
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'DrawPad' }], optionalServices: [SERVICE] });
    dev.addEventListener('gattserverdisconnected', () => { chr = null; $('bBle').textContent = 'Connect ESP32'; status('ESP32 disconnected.'); });
    const srv = await dev.gatt.connect();
    chr = await (await srv.getPrimaryService(SERVICE)).getCharacteristic(CHAR);
    $('bBle').textContent = 'ESP32 connected'; status('Connected. Drawing what is on the canvas...');
    queue = [1]; history.forEach(s => queue.push(...segBytes(s)));   // replay what you already drew
    pump();
  } catch (e) { status('Bluetooth: ' + e.message); }
};
</script>
</body>
</html>
